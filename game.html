
<!DOCTYPE html>
<html lang="tet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Word Game - Scam</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>

<div class="game-container">
    <header>
        <h2><img src="image/image.png" alt="" width="80"></h2>
        <h1>Forma Liafuan / Make a Match</h1>
        <p class="description">
            Liga naran scam ho deskrisaun loos.
        </p>
    </header>

    <div id="gameArea">
        <div class="score-board">
            <div class="score-box">Pontu
                <span id="score">0</span>
            </div>
            <div class="score-box">Pares Loos
                <span><span id="matches">0</span> / <span id="totalPairs">10</span></span>
            </div>
            <div class="score-box">⏱️ Tempu
                <span id="timer">05:00</span>
            </div>
            <div class="score-box">❤️ Vida
                <span id="lives">3</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>
        <div id="message"></div>

        <div class="game-buttons">
            <button class="game-btn" onclick="restartGame()">🔄 Hahú Fali</button>
            <button class="game-btn next-btn" onclick="nextGame()">➡️ Jogu Tuirmai</button>
        </div>
    </div>

    <div id="resultScreen">
        <h2 id="resultTitle">🎉 Game Remata!</h2>
        <p id="resultMessage"></p>
        <h3>Pontu Ikus: <span id="finalScore">0</span></h3>

        <div class="result-buttons">
            <button class="game-btn" onclick="restartGame()">▶️ Joga Fali</button>
            <button class="game-btn next-btn" onclick="nextGame()">➡️ Jogu Tuirmai</button>
        </div>
    </div>
</div>

<script>
const wordPairs = [
    {
        word: "Phishing Scam",
        meaning: "Bosok liuhusi email ka website falsu atu na'ok password no informasaun pesoál."
    },
    {
        word: "Online Shopping Scam",
        meaning: "Vende produtu falsu ka simu osan husi kliente maibé la entrega produtu."
    },
    {
        word: "Romance Scam",
        meaning: "Harii relasaun amor falsu online atu husu osan husi vítima."
    },
    {
        word: "Investment Scam",
        meaning: "Promete lukru boot iha tempu badak atu dada ema investe osan."
    },
    {
        word: "Lottery or Prize Scam",
        meaning: "Informa katak ita manán premiu, maibé tenke selu taxa antes atu simu premiu."
    },
    {
        word: "SMS Scam (Smishing)",
        meaning: "Mensajen SMS falsu ne'ebé tenta na'ok dadus bankáriu ka password."
    },
    {
        word: "Phone Call Scam (Vishing)",
        meaning: "Ema telefone no halo-an hanesan banku ka autoridade atu hetan informasaun sekretu."
    },
    {
        word: "Job Scam",
        meaning: "Promete servisu falsu no husu osan ba taxa rejistu ka treinamentu."
    },
    {
        word: "Identity Theft Scam",
        meaning: "Uza informasaun pesoál ema seluk nian sein autorizasaun atu halo fraude."
    },
    {
        word: "Impersonation Scam",
        meaning: "Kria konta falsu ka halo-an hanesan ita-nia kolega, família, ka autoridade atu husu osan."
    }
];

let cards = [];
let firstCard = null;
let secondCard = null;
let lockBoard = false;
let finished = false;
let score = 0;
let matches = 0;
let lives = 3;
let timeLeft = 300;
let timer;

const gameBoard = document.getElementById("gameBoard");

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startGame() {
    clearInterval(timer);

    score = 0;
    matches = 0;
    lives = 3;
    timeLeft = 300;
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    finished = false;

    document.getElementById("score").textContent = score;
    document.getElementById("matches").textContent = matches;
    document.getElementById("totalPairs").textContent = wordPairs.length;
    document.getElementById("lives").textContent = lives;
    document.getElementById("timer").textContent = "05:00";
    document.getElementById("message").textContent = "";

    document.getElementById("gameArea").style.display = "block";
    document.getElementById("resultScreen").style.display = "none";

    cards = [];

    wordPairs.forEach((pair, index) => {
        cards.push({
            value: pair.word,
            pairId: index
        });

        cards.push({
            value: pair.meaning,
            pairId: index
        });
    });

    shuffle(cards);
    gameBoard.innerHTML = "";

    cards.forEach(card => {
        const button = document.createElement("button");
        button.className = "card";
        button.textContent = card.value;
        button.dataset.pairId = card.pairId;

        button.addEventListener("click", () => selectCard(button));
        gameBoard.appendChild(button);
    });

    timer = setInterval(() => {
        if (finished) return;

        timeLeft--;

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        document.getElementById("timer").textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (timeLeft <= 0) {
            finishGame(false, true);
        }
    }, 1000);
}

function selectCard(card) {
    if (
        lockBoard ||
        finished ||
        card.classList.contains("correct") ||
        card === firstCard
    ) {
        return;
    }

    card.classList.add("selected");

    if (!firstCard) {
        firstCard = card;
        return;
    }

    secondCard = card;
    checkMatch();
}

function checkMatch() {
    const isMatch =
        firstCard.dataset.pairId === secondCard.dataset.pairId;

    if (isMatch) {
        firstCard.classList.remove("selected");
        secondCard.classList.remove("selected");

        firstCard.classList.add("correct");
        secondCard.classList.add("correct");

        score += 10;
        matches++;

        document.getElementById("score").textContent = score;
        document.getElementById("matches").textContent = matches;
        document.getElementById("message").textContent = "✅ Loos! Parsu ida.";

        resetCards();

        if (matches === wordPairs.length) {
            finishGame(true);
        }
    } else {
        lockBoard = true;
        lives--;
        score = Math.max(0, score - 2);

        document.getElementById("lives").textContent = lives;
        document.getElementById("score").textContent = score;
        document.getElementById("message").textContent =
            "❌ La hanesan. Tenta fali!";

        firstCard.classList.add("wrong");
        secondCard.classList.add("wrong");

        setTimeout(() => {
            if (firstCard) {
                firstCard.classList.remove("selected", "wrong");
            }

            if (secondCard) {
                secondCard.classList.remove("selected", "wrong");
            }

            resetCards();

            if (lives <= 0) {
                finishGame(false);
            }
        }, 800);
    }
}

function resetCards() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
}

function finishGame(won, timeUp = false) {
    if (finished) return;

    finished = true;
    clearInterval(timer);
    lockBoard = true;

    document.getElementById("gameArea").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";
    document.getElementById("finalScore").textContent = score;

    if (won) {
        document.getElementById("resultTitle").textContent = "🎉 Parabéns!";
        document.getElementById("resultMessage").textContent =
            "Diak tebes! Ita liga scam 10 hotu-hotu ho loos.";
    } else if (timeUp) {
        document.getElementById("resultTitle").textContent = "⏰ Tempu Hotu Ona!";
        document.getElementById("resultMessage").textContent =
            "Ita nia tempu hotu ona. Joga fali atu koko.";
    } else {
        document.getElementById("resultTitle").textContent = "💔 Game Remata!";
        document.getElementById("resultMessage").textContent =
            "Ita uza vida hotu. Joga fali atu aprende tan.";
    }
}

function restartGame() {
    startGame();
}

function nextGame() {
    window.location.href = "game2.html";
}

function goToMenu() {
    window.location.href = "main_menu.html";
}

startGame();
</script>
</body>
</html>
